name: ci

on:
  push:
    branches: [main]
  pull_request:

# Required by actions/deploy-pages: the job authenticates to Pages with the
# built-in GITHUB_TOKEN, so no secrets need to be configured.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:links
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14.x autorun

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Build for the Pages subpath
        # GitHub Pages serves this project repo from /pradeep-site/, so the
        # build needs a matching base. Root-hosted deploys omit VITE_BASE.
        run: npm run build
        env:
          VITE_BASE: /pradeep-site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
