<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pradeep Kumar — AI Engineer</title>
    <meta
      name="description"
      content="AI Engineer in Bengaluru. Agentic systems, retrieval, and the platforms under them. Author of Crucible."
    />
    <!--
      Share previews. og:image and og:url MUST be absolute — crawlers fetch
      them without a page context, so a root-relative path resolves against
      the wrong host and the card renders blank. Hardcoded rather than
      derived from VITE_BASE for the same reason: there is no origin at
      build time.
    -->
    <meta property="og:title" content="Pradeep Kumar — AI Engineer" />
    <meta
      property="og:description"
      content="Agentic systems, retrieval, and the platforms under them."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://pradeepa2125.github.io/pradeep-site/"
    />
    <meta
      property="og:image"
      content="https://pradeepa2125.github.io/pradeep-site/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pradeep Kumar's site — a dusk mountain landscape behind the words Still figuring it out, at speed."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pradeep Kumar — AI Engineer" />
    <meta
      name="twitter:description"
      content="Agentic systems, retrieval, and the platforms under them."
    />
    <meta
      name="twitter:image"
      content="https://pradeepa2125.github.io/pradeep-site/og.jpg"
    />
    <meta name="theme-color" content="#141225" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
